<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="designer/estilos.css">
  <title>GW - Simulador Game &amp; Watch</title>
  <meta name="description"
    content="Generador de juegos de tipo Game&Watch, genera un 'cartucho' que puede simular directamente, y un programa para su uso en un ESP32." />
</head>

<body data-vista="vistaSetup">
  <h1>Simulador Game &amp; Watch</h1>

  <!-- Línea de estado (F5-I12): los botones viven ahora dentro de su
       pestaña; aquí solo quedan los inputs de fichero (ocultos, uno por
       tipo de carga: los botones de todas las pestañas los comparten) y
       la línea de estado, siempre visible. -->
  <div id="controles">
    <input type="file" id="ficheroSetup" accept=".json,application/json" class="oculto">
    <input type="file" id="carpetaCartucho" webkitdirectory class="oculto">
    <input type="file" id="ficheroGWBZip" accept=".zip,application/zip" class="oculto">
    <input type="file" id="ficheroGWIZip" accept=".zip,application/zip" class="oculto">
    <input type="file" id="ficheroGWC" accept=".gwc" class="oculto">
    <span id="estado">Sin setup cargado.</span>
  </div>

  <!-- Pestañas (F5-I12), en el orden del trabajo: Setup, Cartucho,
       Editor, Sprites, Simulador. Al inicio solo Setup; cada una se
       activa cuando hay los datos que necesita (actualizarPestanas). -->
  <nav id="pestanas">
    <button id="pesSetup" class="pestActiva">Setup</button>
    <button id="pesCartucho" disabled>Cartucho</button>
    <button id="pesEditor" disabled>Editor</button>
    <button id="pesSprites" disabled>Segmentos y Sprites</button>
    <button id="pesSimulador" disabled>Simulador</button>
    <button id="pesPruebas" class="oculto" disabled>Pruebas</button>
  </nav>

  <!-- Vista SETUP (F5-I12): la ficha del GWS y sus botones. -->
  <div id="vistaSetup">
    <div class="barraBotones">
      <button id="btnCargarSetup" title="Carga un setup (.json)">Cargar GWS</button>
      <button id="btnAplicarSetup" title="Aplica el setup de la ficha (limpia el cartucho)">Aplicar</button>
      <button id="btnGuardarSetup" title="Guarda el setup de la ficha como .json y lo aplica">Guardar GWS</button>
    </div>
    <div id="fichaSetup"></div>
  </div>


  <!-- Vista SIMULADOR: la carcasa con la pantalla y los botones físicos -->
  <div id="vistaSimulador" class="oculto">
    <div class="barraBotones">
      <button id="btnSimGWI" disabled title="Carga un cartucho_gwi.zip">Cargar GWI</button>
      <button id="btnSimGWC" disabled title="Carga el cartucho de ejecución cartucho_gwc.gwc">Cargar GWC</button>
    </div>

    <!-- Carcasa: solo visible tras cargar un setup correcto.
         Hay UN DISEÑO INDEPENDIENTE por cada estilo de máquina; el motor
         muestra el que toca y cuelga la pantalla en su hueco. -->
    <div id="maquina" class="oculto">

      <!-- Los diseños parten de disponer a la izquierda de una cruceta, y a la derecha de dos botones, alineados así (se muestra el número asociado a cada botón): -->
      <!--    2                                                                                                                                                     -->
      <!--  0   1                    4                                                                                                                              -->
      <!--    3                      5                                                                                                                              -->
      <!-- De esta manera se puede distribuir los botones para las máquinas de 2, 4 o 5 botones de manera uniforme, los botones están en el mismo lugar siempre     -->
      <!-- en el simulador                                                                                                                                          -->

      <!-- Diseño de máquina de 2 botones: 0 a la izquierda, 4 a la derecha -->
      <div id="maquina-2" class="diseno oculto">
        <div class="filaJuego">
          <div id="m2-izq" class="huecoBoton"></div>
          <div class="huecoPantalla"><canvas id="pantalla"></canvas></div>
          <div id="m2-der" class="huecoBoton"></div>
        </div>
        <div id="m2-sistema" class="filaSistema"></div>
      </div>

      <!-- Diseño de máquina de 4 botones: 0 y 1 a la izquierda, 4 y 5 a la derecha -->
      <div id="maquina-4" class="diseno oculto">
        <div class="filaJuego">
          <div id="m4-izq" class="huecoBoton columnaPar"></div>
          <div class="huecoPantalla"></div>
          <div id="m4-der" class="huecoBoton columnaPar"></div>
        </div>
        <div id="m4-sistema" class="filaSistema"></div>
      </div>

      <!-- Diseño de máquina de 5 botones: cruceta 0,1,2,3 a la izquierda, 4 a la derecha -->
      <div id="maquina-5" class="diseno oculto">
        <div class="filaJuego">
          <div id="m5-izq" class="huecoBoton cruceta"></div>
          <div class="huecoPantalla"></div>
          <div id="m5-der" class="huecoBoton"></div>
        </div>
        <div id="m5-sistema" class="filaSistema"></div>
      </div>

    </div>

  </div>

  <!-- Vista EDITOR: el mapa y el panel de propiedades LADO A LADO (el
       panel a la derecha) para que todo quepa en una sola pantalla.
       Con ventana estrecha el panel cae debajo del mapa (flex-wrap).
       Los botones están en la barra contextual superior. -->
  <div id="vistaEditor" class="oculto">
    <div class="barraBotones">
      <button id="btnEdGWB" disabled title="Carga la carpeta del cartucho de autoría (GWB)">Cargar GWB</button>
      <button id="btnEdGWBZip" disabled title="Carga el cartucho de autoría en ZIP">Cargar GWB (ZIP)</button>
      <button id="btnEdGWI" disabled title="Carga un cartucho_gwi.zip">Cargar GWI</button>
      <button id="btnGuardar" disabled>Verificar y Guardar</button>
      <button id="btnGenerar" disabled
        title="Genera cartucho_GWB.zip, cartucho_gwi.zip y cartucho_gwc.gwc, con el Código GWC del par">Generar
        GWB+GWI+GWC</button>
      <button id="btnDeshacer" disabled title="Ctrl+Z">Deshacer</button>
      <button id="btnRehacer" disabled title="Ctrl+Y">Rehacer</button>
    </div>
    <div id="lienzoEditor">
      <!-- Mapa de objetos: la imagen con los segmentos numerados, clicable y en colores según su tipo y relaciones -->
      <div id="zonaMapa" class="oculto">
        <canvas id="mapaSegmentos"></canvas>
      </div>
      <!-- Panel de propiedades del segmento seleccionado -->
      <div id="panelSegmento" class="oculto"></div>
    </div>
  </div>

  <!-- Vista SEGMENTOS Y SPRITES: la lista de segmentos con su imagen,
       en sublistas, y al final las imágenes sin segmento (la
       construye BaseDescomponer.pintarListaSegmentos). -->
  <div id="vistaSprites" class="oculto">
    <div id="listaSegmentos"></div>
  </div>

  <!-- Vista CARTUCHO (F5-I10): la ficha del cartucho: datos del GWB,
       las tres imágenes con sus botones Cargar/Borrar y la tabla de
       botones. Nace en blanco y editable; la construye BaseFicha.pintar. -->
  <div id="vistaCartucho" class="oculto">
    <div class="barraBotones">
      <button id="btnCargarCartucho" disabled title="Carga la carpeta del cartucho de autoría (GWB)">Cargar GWB</button>
      <button id="btnCargarGWBZip" disabled title="Carga el cartucho de autoría en ZIP (cartucho_GWB.zip)">Cargar GWB
        (ZIP)</button>
      <button id="btnCargarGWIZip" disabled title="Carga un cartucho_gwi.zip">Cargar GWI</button>
      <button id="btnAplicarCartucho" disabled
        title="Aplica la ficha: descarta los datos del Editor y de Sprites y los extrae de nuevo">Aplicar</button>
      <button id="btnGuardarGWB" disabled title="Verifica la ficha y guarda cartucho_GWB.zip">Guardar GWB</button>
    </div>
    <div id="fichaCartucho"></div>
  </div>

  <!-- Vista PRUEBAS: SOLO con GW_DEBUG activo (la pestaña correspondiente la
       descubre pruebas/pruebas.js). Sus botones lanzan EN LA PÁGINA las pruebas
       portadas del directorio pruebas y pintan el resultado en esta vista; no
       tocan el cartucho en edición. -->
  <div id="vistaPruebas" class="oculto">
    <div id="barraPruebas" class="barraBotones"></div>
    <div id="salidaPruebas"></div>
  </div>

  <!-- Panel de información (F5-I7): Simulador, la máquina y el
       cartucho; Editor, además, los datos del diseño. En Segmentos y
       Sprites no se muestra (lo oculta el CSS). -->
  <div id="panelEstado" class="oculto">
    <div id="infoMaquina" class="infoLinea"></div>
    <div id="infoDiseno" class="infoLinea"></div>
  </div>

  <!-- Scripts clásicos (SIN type="module") para poder abrir con doble clic (file://).
       Orden: librerías primero (extractor, motor), luego quien las usa
       (descomponer), el orquestador del editor (director), y al final el
       simulador de la Fase 2: sus dos motores y el reloj (directorjuego). -->
  <!-- Llave de depuración de los motores (Fase 2): con true, el
       motor de juego cuenta en consola (F12) las dos cosas que
       hace en cada tick (apagar banderas de cambiado, encender o
       apagar segmentos); con false, la consola queda limpia. -->
  <script>var GW_DEBUG = true;</script>
  <script src="designer/jszip.min.js"></script>
  <script src="designer/ComunListas.js"></script>
  <script src="designer/BaseExtractor.js"></script>
  <script src="designer/BaseGraficos.js"></script>
  <script src="designer/BaseDescomponer.js"></script>
  <script src="designer/BasePACK.js"></script> <!-- Manejo de ficheros comprimidos -->
  <script src="designer/BaseCartucho.js"></script> <!-- Manejo de Cartuchos -->
  <script src="designer/BaseSetup.js"></script> <!-- La ficha de la pestaña Setup (F5-I12, no depende de nadie). -->
  <script src="designer/BaseFicha.js"></script> <!-- La ficha de la pestaña Cartucho (no depende de nadie). -->
  <script src="designer/BaseDirector.js"></script>
  <script src="designer/JuegoMotorEstados.js"></script>
  <script src="designer/JuegoMotorGrafico.js"></script>
  <script src="designer/JuegoDirector.js"></script>
  <script src="pruebas/pruebas.js"></script> <!-- Ejecutor de las Pruebas (pestaña Pruebas). -->
  <script src="pruebas/pruebasGenerales.js"></script>
  <script src="pruebas/pruebasGWI_GWC.js"></script>
  <script src="pruebas/pruebasMotor.js"></script>
  <script src="pruebas/pruebasDirector.js"></script>
  <script src="pruebas/pruebasEditor.js"></script>
  <script>Pruebas.inicializar();</script> <!-- Crea los botones una vez registradas todas -->
</body>

</html>
